#splash{position:fixed;inset:0;background:#1a0533;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:opacity .5s ease,visibility .5s ease}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash img{width:200px;height:auto;animation:splashPop .5s cubic-bezier(.34,1.56,.64,1) forwards}
#splash .splash-word{font-family:Georgia,serif;font-size:36px;font-weight:800;color:#ede9ff;letter-spacing:-0.5px;margin-top:16px;opacity:0;animation:splashFade .4s ease .3s forwards}
#splash .splash-sub{font-family:'Courier New',monospace;font-size:11px;color:#6e6a8a;letter-spacing:.18em;text-transform:uppercase;margin-top:6px;opacity:0;animation:splashFade .4s ease .5s forwards}
@keyframes splashPop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes splashFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

<style>
[data-theme="dark"]{
  --bg:#080810;--bg2:#0d0d1a;
  --surface:#111120;--surface2:#181828;--surface3:#1e1e32;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--border3:rgba(255,255,255,0.22);
  --text:#ede9ff;--muted:#6e6a8a;--muted2:#9592b0;
  --accent:#a78bfa;--accent2:#7c3aed;--accent-glow:rgba(167,139,250,0.15);
  --red:#f87171;--red-bg:rgba(248,113,113,0.12);
  --green:#34d399;--green-bg:rgba(52,211,153,0.12);
  --gold:#fbbf24;
  --tog-bg:#1e1e32;--tog-knob:#a78bfa;
  --shadow:0 8px 32px rgba(0,0,0,.5);
}
[data-theme="light"]{
  --bg:#f0eeff;--bg2:#e8e3ff;
  --surface:#ffffff;--surface2:#f4f2ff;--surface3:#ede9ff;
  --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.12);--border3:rgba(0,0,0,0.2);
  --text:#1a1533;--muted:#8b85b0;--muted2:#5e587a;
  --accent:#7c3aed;--accent2:#5b21b6;--accent-glow:rgba(124,58,237,0.1);
  --red:#dc2626;--red-bg:rgba(220,38,38,0.08);
  --green:#059669;--green-bg:rgba(5,150,105,0.08);
  --gold:#d97706;
  --tog-bg:#ede9ff;--tog-knob:#7c3aed;
  --shadow:0 8px 32px rgba(124,58,237,.1);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:system-ui,'Segoe UI',sans-serif;overscroll-behavior:none;transition:background .25s,color .25s;-webkit-font-smoothing:antialiased}

/* ══ APP SHELL ══ */
.app{display:flex;min-height:100dvh}

/* ══ SIDEBAR ══ */
.sidebar{
  width:260px;flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border2);
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;z-index:40;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.sidebar-logo{padding:28px 22px 22px;border-bottom:1px solid var(--border)}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 14px var(--accent-glow)}
.logo-text{font-family:Georgia,serif;font-size:22px;font-weight:800;letter-spacing:-0.3px}
.logo-sub{font-size:10px;font-family:'Courier New',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-top:1px}

.sidebar-nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;cursor:pointer;transition:all .18s;color:var(--muted2);font-size:13.5px;font-weight:500;border:none;background:none;width:100%;text-align:left;position:relative}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-glow);color:var(--accent);font-weight:600}
.nav-icon{font-size:17px;width:20px;text-align:center;flex-shrink:0;line-height:1}
.nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-family:'Courier New',monospace}

.sidebar-bottom{padding:12px 10px;border-top:1px solid var(--border)}
.theme-row{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-radius:11px;background:var(--surface2);margin-bottom:8px}
.theme-label{font-size:13px;color:var(--muted2);font-weight:500}
.toggle-btn{width:44px;height:26px;border-radius:13px;background:var(--tog-bg);border:1px solid var(--border2);cursor:pointer;position:relative;flex-shrink:0;transition:background .2s}
.toggle-knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--tog-knob);transition:transform .22s cubic-bezier(.4,0,.2,1);box-shadow:0 2px 6px rgba(0,0,0,.3)}
[data-theme="light"] .toggle-knob{transform:translateX(18px)}

.add-btn-sidebar{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:11px;background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;color:#fff;font-family:system-ui,'Segoe UI',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px var(--accent-glow)}
.add-btn-sidebar:hover{transform:translateY(-1px);box-shadow:0 6px 24px var(--accent-glow)}
.add-btn-sidebar:active{transform:scale(.97)}
.backup-row{display:flex;gap:7px;margin-top:8px}
.backup-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 8px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);color:var(--muted2);font-family:system-ui,'Segoe UI',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .18s}
.backup-btn:hover{background:var(--surface3);color:var(--text);border-color:var(--border3)}
.backup-btn:active{transform:scale(.96)}

/* ══ MAIN ══ */
.main{margin-left:260px;flex:1;display:flex;flex-direction:column;min-height:100dvh;max-width:calc(100vw - 260px)}

/* Topbar */
.topbar{padding:28px 32px 0;flex-shrink:0}
.topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px}
.page-title{font-family:Georgia,serif;font-size:24px;font-weight:700;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:10px}
.month-nav{display:flex;align-items:center;gap:6px}
.mnav-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:9px;color:var(--muted2);font-size:16px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:all .15s;flex-shrink:0}
.mnav-btn:hover{border-color:var(--accent);color:var(--accent)}
.mnav-btn:disabled{opacity:.3;cursor:default;pointer-events:none}
.month-badge{font-family:'Courier New',monospace;font-size:11.5px;color:var(--text);background:var(--surface2);border:1px solid var(--border2);padding:6px 14px;border-radius:20px;min-width:118px;text-align:center;font-weight:500}

/* Summary */
.summary-grid{background:var(--surface);border:1px solid var(--border2);border-radius:16px;overflow:hidden;padding:14px 16px}
.s-card{display:none}
.s-balance-row{margin-bottom:10px}
.s-sub-row{display:flex;gap:0;border-top:1px solid var(--border);padding-top:10px}
.s-sub-item{flex:1;padding-right:12px}
.s-sub-item:last-child{padding-right:0;padding-left:12px;border-left:1px solid var(--border)}
.s-label{font-size:9px;color:var(--muted);font-family:'Courier New',monospace;text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px}

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-row">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="hamburger" onclick="openSidebar()">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="2" y1="5" x2="16" y2="5"/><line x1="2" y1="9" x2="16" y2="9"/><line x1="2" y1="13" x2="16" y2="13"/>
          </svg>
        </button>
        <div class="month-nav">
          <button class="mnav-btn" onclick="shiftMonth(-1)">&#8249;</button>
          <div class="month-badge" id="month-badge"></div>
          <button class="mnav-btn" id="mnav-next" onclick="shiftMonth(1)">&#8250;</button>
        </div>
      </div>
      <div class="topbar-right">
        <button class="fab-desk" onclick="openSheet()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Entry
        </button>
      </div>
    </div>
    <div class="summary-grid">
      <div class="s-balance-row">
        <div class="s-label">Net Balance</div>
        <div class="s-val big" id="s-balance">AED 0.00</div>
        <div class="s-hint" id="s-period"></div>
      </div>
      <div class="s-sub-row">
        <div class="s-sub-item">
          <div class="s-label">Income</div>
          <div class="s-val income" id="s-income">AED 0</div>
        </div>
        <div class="s-sub-item">
          <div class="s-label">Spent</div>
          <div class="s-val spent" id="s-spent">AED 0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab active" id="dtab-txns" onclick="switchTab('txns')">Transactions</button>
    <button class="tab" id="dtab-breakdown" onclick="switchTab('breakdown')">Analytics</button>
    <button class="tab" id="dtab-budget" onclick="switchTab('budget')">Budget Plan</button>
    <button class="tab" id="dtab-manage" onclick="switchTab('manage')">Categories</button>
    <button class="tab" id="dtab-calendar" onclick="switchTab('calendar')">Calendar</button>
  </div>

  <div class="content">

    <!-- TRANSACTIONS -->
    <div class="pane active" id="pane-txns">
      <div class="filter-row">
        <select class="fsel" id="f-type" onchange="renderTxns()">
          <option value="all">All types</option>
          <option value="income">Income</option>
          <option value="expense">Expenses</option>
        </select>
        <select class="fsel" id="f-cat" onchange="renderTxns()">
          <option value="all">All categories</option>
        </select>
      </div>
      <div class="tx-list" id="tx-list"></div>
    </div>

    <!-- ANALYTICS -->
    <div class="pane" id="pane-breakdown">
      <div class="charts-grid">
        <div class="chart-card">
          <div class="chart-title">Spending by category</div>
          <canvas id="pie-chart"></canvas>
          <div class="pie-legend" id="pie-legend"></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">6-month income vs spending</div>
          <canvas id="trend-chart"></canvas>
        </div>
      </div>
      <div class="sec-label">Category breakdown</div>
      <div class="brkdn" id="breakdown"></div>
    </div>

    <!-- BUDGET -->
    <div class="pane" id="pane-budget">
      <div class="bgt-section">
        <div class="sec-label">Expected income</div>
        <div id="bgt-income-form">
          <div class="bgt-income-row">
            <div class="field"><input type="number" id="b-inc-val" placeholder="AED amount" inputmode="decimal" min="0" step="0.01"></div>
            <button class="small-btn" onclick="setBudgetIncome()">Set</button>
          </div>
        </div>
        <div id="budget-income-display"></div>
      </div>
      <div class="bgt-section">
        <div class="bgt-hdr">
          <h3>Expense limits</h3>
          <button class="bgt-add-btn" onclick="toggleAddBudget()">+ Add limit</button>
        </div>
        <div class="bgt-add-form" id="add-budget-form" style="display:none">
          <div class="form-row">
            <div class="field" style="margin:0"><label>Category</label><select id="b-cat"></select></div>
            <div class="field" style="margin:0"><label>Budget (AED)</label><input type="number" id="b-amt" placeholder="0.00" inputmode="decimal" min="0" step="0.01"></div>
          </div>
          <button class="submit-btn" style="padding:11px" onclick="addBudgetItem()">Add budget</button>
        </div>
        <div id="budget-items"></div>
        <div id="budget-summary-card"></div>
      </div>
    </div>

    <!-- CATEGORIES MANAGEMENT -->
    <div class="pane" id="pane-manage">
      <div class="mgmt-section">
        <h3>Manage categories</h3>
        <div class="cat-list" id="cat-list"></div>
        <div class="add-cat-form" id="add-cat-form" style="display:none">
          <div class="cat-form-grid">
            <div class="field" style="margin:0"><label>Emoji</label><input type="text" id="new-cat-emoji" placeholder="🏷" maxlength="2" style="text-align:center;font-size:20px;padding:8px 4px"></div>
            <div class="field" style="margin:0"><label>Category name</label><input type="text" id="new-cat-name" placeholder="e.g. Gym, Travel…"></div>
            <div class="field" style="margin:0"><label>Color</label><input type="color" id="new-cat-color" value="#a78bfa"></div>
          </div>
          <button class="submit-btn" style="padding:11px" onclick="saveNewCategory()">Add category</button>
        </div>
        <button class="outline-btn" onclick="toggleAddCatForm()">+ New category</button>
      </div>
    </div>

    <!-- CALENDAR -->
    <div class="pane" id="pane-calendar">
      <div class="cal-wrap">
        <div class="cal-legend">
          <div class="cal-legend-item"><div class="cal-legend-swatch" style="background:rgba(248,113,113,0.36)"></div>High spend</div>
          <div class="cal-legend-item"><div class="cal-legend-swatch" style="background:rgba(248,113,113,0.15)"></div>Low spend</div>
          <div class="cal-legend-item"><div class="cal-legend-swatch" style="background:var(--accent-glow);border:1px solid var(--accent)"></div>Today</div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-detail" id="cal-detail" style="display:none"></div>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /main -->

<div class="sheet-overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sh-handle"></div>
  <div class="sh-hdr"><div class="sh-title">Add entry</div><button class="sh-close" onclick="closeSheet()">✕</button></div>
  <div class="sh-tabs">
    <button class="sh-tab active" onclick="switchForm('expense',this)">Expense</button>
    <button class="sh-tab" onclick="switchForm('income',this)">Income</button>
  </div>
  <div id="form-expense">
    <div class="field"><label>Description</label><input type="text" id="e-desc" placeholder="e.g. Lunch at cafe"></div>
    <div class="field"><label>Category</label><select id="e-cat"></select></div>
    <div class="field"><label>Amount (AED)</label><input type="number" id="e-amt" placeholder="0.00" min="0" step="0.01" inputmode="decimal"></div>
    <div class="field"><label>Date</label><input type="date" id="e-date"></div>
    <button class="submit-btn" onclick="addExpense()">Log expense</button>
  </div>
  <div id="form-income" style="display:none">
    <div class="field"><label>Source</label><input type="text" id="i-desc" placeholder="e.g. Salary, Freelance"></div>
    <div class="field"><label>Amount (AED)</label><input type="number" id="i-amt" placeholder="0.00" min="0" step="0.01" inputmode="decimal"></div>
    <div class="field"><label>Date</label><input type="date" id="i-date"></div>
    <button class="submit-btn" onclick="addIncome()">Log income</button>
  </div>
</div>

<!-- EDIT SHEET -->
<div class="sheet-overlay" id="edit-overlay" onclick="closeEditSheet()"></div>
<div class="sheet" id="edit-sheet">
  <div class="sh-handle"></div>
  <div class="sh-hdr"><div class="sh-title">Edit entry</div><button class="sh-close" onclick="closeEditSheet()">✕</button></div>
  <input type="hidden" id="edit-id">
  <div id="edit-form-expense">
    <div class="field"><label>Description</label><input type="text" id="edit-e-desc"></div>
    <div class="field"><label>Category</label><select id="edit-e-cat"></select></div>
    <div class="field"><label>Amount (AED)</label><input type="number" id="edit-e-amt" min="0" step="0.01" inputmode="decimal"></div>
    <div class="field"><label>Date</label><input type="date" id="edit-e-date"></div>
    <button class="submit-btn" onclick="saveEdit()">Save changes</button>
  </div>
  <div id="edit-form-income" style="display:none">
    <div class="field"><label>Source</label><input type="text" id="edit-i-desc"></div>
    <div class="field"><label>Amount (AED)</label><input type="number" id="edit-i-amt" min="0" step="0.01" inputmode="decimal"></div>
    <div class="field"><label>Date</label><input type="date" id="edit-i-date"></div>
    <button class="submit-btn" onclick="saveEdit()">Save changes</button>
  </div>
</div>

<script>
/* DEFAULT CATEGORIES */
const DEFAULT_CATS=[
  {name:'Food',emoji:'🍽',color:'#34d399',builtin:true},
  {name:'Petrol',emoji:'⛽',color:'#f5a623',builtin:true},
  {name:'Bills',emoji:'🧾',color:'#5b9cf6',builtin:true},
  {name:'Parking',emoji:'🅿',color:'#94a3b8',builtin:true},
  {name:'Debt',emoji:'💳',color:'#f87171',builtin:true},
  {name:'Groceries',emoji:'🛒',color:'#74d680',builtin:true},
  {name:'Transport',emoji:'🚗',color:'#a78bfa',builtin:true},
  {name:'Health',emoji:'💊',color:'#f472b6',builtin:true},
  {name:'Shopping',emoji:'🛍',color:'#fb923c',builtin:true},
  {name:'Rent',emoji:'🏠',color:'#38bdf8',builtin:true},
  {name:'Savings',emoji:'🏦',color:'#fbbf24',builtin:true},
  {name:'Other',emoji:'•',color:'#6b7280',builtin:true},
];

/* STATE */
let data=[], budget={income:0,items:[]};
let categories=[...DEFAULT_CATS];
let activeTab='txns', pieChart=null, trendChart=null, viewOffset=0;

/* ── PERMANENT STORAGE KEYS (never change these) ── */
const KEY_DATA   = 'tracker_data_v1';
const KEY_BUDGET = 'tracker_budget_v1';
const KEY_CATS   = 'tracker_cats_v1';
const KEY_THEME  = 'tracker_theme';

/* ── MIGRATION: rescue data from any previous key name ── */
(function migrate(){
  const DATA_OLD   = ['tracker_data2','tracker_data','spendly_v2','spendly_data'];
  const BUDGET_OLD = ['tracker_budget2','tracker_budget','spendly_budget'];
  const CATS_OLD   = ['tracker_cats2','tracker_cats'];
  function firstFound(keys){
    for(const k of keys){try{const v=localStorage.getItem(k);if(v)return v;}catch(e){}}
    return null;
  }
  // Only migrate if the permanent key doesn't exist yet
  if(!localStorage.getItem(KEY_DATA)){
    const old=firstFound(DATA_OLD);
    if(old)try{localStorage.setItem(KEY_DATA,old);}catch(e){}
  }
  if(!localStorage.getItem(KEY_BUDGET)){
    const old=firstFound(BUDGET_OLD);
    if(old)try{localStorage.setItem(KEY_BUDGET,old);}catch(e){}
  }
  if(!localStorage.getItem(KEY_CATS)){
    const old=firstFound(CATS_OLD);
    if(old)try{localStorage.setItem(KEY_CATS,old);}catch(e){}
  }
})();

/* ── LOAD ── */
try{const s=localStorage.getItem(KEY_DATA);if(s)data=JSON.parse(s);}catch(e){}
try{const b=localStorage.getItem(KEY_BUDGET);if(b)budget=JSON.parse(b);}catch(e){}
try{const c=localStorage.getItem(KEY_CATS);if(c)categories=JSON.parse(c);}catch(e){}
try{const t=localStorage.getItem(KEY_THEME);if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}

/* HELPERS */
const isDark=()=>document.documentElement.getAttribute('data-theme')==='dark';
const save=()=>{try{localStorage.setItem(KEY_DATA,JSON.stringify(data));}catch(e){}};
const saveBudget=()=>{try{localStorage.setItem(KEY_BUDGET,JSON.stringify(budget));}catch(e){}};
const saveCats=()=>{try{localStorage.setItem(KEY_CATS,JSON.stringify(categories));}catch(e){}};
const fmt=n=>'AED '+Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const fmtS=n=>n>=1000?'AED '+(n/1000).toFixed(1)+'k':'AED '+Math.round(n);
const today=()=>new Date().toISOString().slice(0,10);
const catColor=n=>(categories.find(c=>c.name===n)||{}).color||'#888';
const catEmoji=n=>(categories.find(c=>c.name===n)||{}).emoji||'•';

function viewMonthDate(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+viewOffset);return d;}
function viewMonthKey(){const d=viewMonthDate();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function monthName(){return viewMonthDate().toLocaleDateString('en-AE',{month:'long',year:'numeric'});}
function dataForMonth(k){return data.filter(d=>d.date&&d.date.startsWith(k));}

/* POPULATE SELECTS */
function populateSelects(){
  const expCats=categories.filter(c=>c.name!=='Income');
  ['e-cat','edit-e-cat','b-cat'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    const cur=el.value;
    el.innerHTML=expCats.map(c=>`<option value="${c.name}">${c.emoji} ${c.name}</option>`).join('');
    if(cur)el.value=cur;
  });
  const fc=document.getElementById('f-cat');
  if(fc){const cur=fc.value;fc.innerHTML='<option value="all">All categories</option>'+categories.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');if(cur)fc.value=cur;}
}

/* THEME */
function toggleTheme(){
  const next=isDark()?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem(KEY_THEME,next);
  if(activeTab==='breakdown')renderBreakdown();
}

/* SIDEBAR */
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebar-backdrop').classList.add('open');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebar-backdrop').classList.remove('open');}

/* TABS */
function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('pane-'+tab).classList.add('active');
  ['dtab','snav','bnav'].forEach(prefix=>{
    document.querySelectorAll(`[id^="${prefix}-"]`).forEach(el=>el.classList.remove('active'));
    const el=document.getElementById(prefix+'-'+tab);if(el)el.classList.add('active');
  });
  closeSidebar();
  if(tab==='breakdown')renderBreakdown();
  if(tab==='budget')renderBudget();
  if(tab==='manage')renderCatList();
  if(tab==='calendar')renderCalendar();
}

/* MONTH NAV */
function shiftMonth(dir){
  if(viewOffset+dir>0)return;
  viewOffset+=dir;render();
}

/* SHEETS */
function openSheet(){
  document.getElementById('e-date').value=today();
  document.getElementById('i-date').value=today();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){document.getElementById('overlay').classList.remove('open');document.getElementById('sheet').classList.remove('open');}
function openEditSheet(){document.getElementById('edit-overlay').classList.add('open');document.getElementById('edit-sheet').classList.add('open');}
function closeEditSheet(){document.getElementById('edit-overlay').classList.remove('open');document.getElementById('edit-sheet').classList.remove('open');}
function switchForm(type,btn){
  document.getElementById('form-expense').style.display=type==='expense'?'block':'none';
  document.getElementById('form-income').style.display=type==='income'?'block':'none';
  document.querySelectorAll('.sh-tabs .sh-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
}

/* CRUD */
function addExpense(){
  const desc=document.getElementById('e-desc').value.trim()||'Expense';
  const cat=document.getElementById('e-cat').value;
  const amt=parseFloat(document.getElementById('e-amt').value);
  const date=document.getElementById('e-date').value||today();
  if(!amt||amt<=0)return;
  data.push({id:Date.now(),type:'expense',desc,cat,amount:amt,date});
  data.sort((a,b)=>a.date<b.date?1:-1);
  save();render();closeSheet();
  document.getElementById('e-desc').value='';document.getElementById('e-amt').value='';
}
function addIncome(){
  const desc=document.getElementById('i-desc').value.trim()||'Income';
  const amt=parseFloat(document.getElementById('i-amt').value);
  const date=document.getElementById('i-date').value||today();
  if(!amt||amt<=0)return;
  data.push({id:Date.now(),type:'income',desc,cat:'Income',amount:amt,date});
  data.sort((a,b)=>a.date<b.date?1:-1);
  save();render();closeSheet();
  document.getElementById('i-desc').value='';document.getElementById('i-amt').value='';
}
function deleteEntry(id){
  if(confirm('Delete this entry?')){data=data.filter(d=>d.id!==id);save();render();}
}
function editEntry(id){
  const e=data.find(d=>d.id===id);if(!e)return;
  document.getElementById('edit-id').value=id;
  if(e.type==='expense'){
    document.getElementById('edit-form-expense').style.display='block';
    document.getElementById('edit-form-income').style.display='none';
    document.getElementById('edit-e-desc').value=e.desc;
    document.getElementById('edit-e-cat').value=e.cat;
    document.getElementById('edit-e-amt').value=e.amount;
    document.getElementById('edit-e-date').value=e.date;
  } else {
    document.getElementById('edit-form-expense').style.display='none';
    document.getElementById('edit-form-income').style.display='block';
    document.getElementById('edit-i-desc').value=e.desc;
    document.getElementById('edit-i-amt').value=e.amount;
    document.getElementById('edit-i-date').value=e.date;
  }
  openEditSheet();
}
function saveEdit(){
  const id=parseInt(document.getElementById('edit-id').value);
  const idx=data.findIndex(d=>d.id===id);if(idx<0)return;
  const e=data[idx];
  if(e.type==='expense'){
    e.desc=document.getElementById('edit-e-desc').value.trim()||'Expense';
    e.cat=document.getElementById('edit-e-cat').value;
    e.amount=parseFloat(document.getElementById('edit-e-amt').value)||e.amount;
    e.date=document.getElementById('edit-e-date').value||e.date;
  } else {
    e.desc=document.getElementById('edit-i-desc').value.trim()||'Income';
    e.amount=parseFloat(document.getElementById('edit-i-amt').value)||e.amount;
    e.date=document.getElementById('edit-i-date').value||e.date;
  }
  data.sort((a,b)=>a.date<b.date?1:-1);
  save();render();closeEditSheet();
}

/* CARRY FORWARD — closing balance of all months before the given key */
function carryForward(key){
  return data
    .filter(d=>d.date&&d.date.slice(0,7)<key)
    .reduce((s,d)=>d.type==='income'?s+d.amount:s-d.amount,0);
}

/* RENDER */
function render(){
  const key=viewMonthKey();
  document.getElementById('month-badge').textContent=monthName();
  document.getElementById('mnav-next').disabled=viewOffset===0;
  const md=dataForMonth(key);
  const inc=md.filter(d=>d.type==='income').reduce((s,d)=>s+d.amount,0);
  const spent=md.filter(d=>d.type==='expense').reduce((s,d)=>s+d.amount,0);
  const cf=carryForward(key);
  const bal=cf+inc-spent;
  const bEl=document.getElementById('s-balance');
  bEl.textContent=fmt(bal);bEl.className='s-val big '+(bal>=0?'pos':'neg');
  document.getElementById('s-income').textContent=fmtS(inc);
  document.getElementById('s-spent').textContent=fmtS(spent);
  document.getElementById('s-period').textContent=viewOffset===0?'This month':monthName();
  renderTxns();
  if(activeTab==='breakdown')renderBreakdown();
  if(activeTab==='budget')renderBudget();
  if(activeTab==='calendar')renderCalendar();
}

function renderTxns(){
  const key=viewMonthKey();
  const type=document.getElementById('f-type').value;
  const cat=document.getElementById('f-cat').value;
  let rows=dataForMonth(key).slice().reverse();
  if(type!=='all')rows=rows.filter(d=>d.type===type);
  if(cat!=='all')rows=rows.filter(d=>d.cat===cat);
  const el=document.getElementById('tx-list');
  const cf=carryForward(key);
  let html='';
  if(type==='all'&&cat==='all'){
    const prevDate=new Date(viewMonthDate());prevDate.setMonth(prevDate.getMonth()-1);
    const prevKey=prevDate.getFullYear()+'-'+String(prevDate.getMonth()+1).padStart(2,'0');
    const hasPrev=data.some(d=>d.date&&d.date.slice(0,7)<=prevKey);
    if(hasPrev){
      const cfColor=cf>=0?'var(--green)':'var(--red)';
      const cfSign=cf>=0?'+':'';
      html+=`<div class="cf-banner"><div class="cf-label">Carried forward</div><div class="cf-amt" style="color:${cfColor}">${cfSign}${fmt(cf)}</div></div>`;
    }
  }
  if(!rows.length){el.innerHTML=html+'<div class="empty">No entries for this month.<br>Tap + to add one.</div>';return;}
  let lastDate='';
  rows.forEach(d=>{
    if(d.date!==lastDate){
      const label=d.date===today()?'Today':new Date(d.date+'T00:00:00').toLocaleDateString('en-AE',{weekday:'short',month:'short',day:'numeric'});
      html+=`<div class="sec-label">${label}</div>`;lastDate=d.date;
    }
    const col=catColor(d.cat),emoji=catEmoji(d.cat);
    const sign=d.type==='income'?'+':'-',acls=d.type==='income'?'pos':'neg';
    html+=`<div class="tx-item">
      <div class="tx-dot" style="background:${col}22;color:${col}">${emoji}</div>
      <div class="tx-body"><div class="tx-desc">${d.desc}</div><div class="tx-meta">${d.cat}</div></div>
      <div class="tx-right">
        <div class="tx-amt ${acls}">${sign}${fmt(d.amount)}</div>
        <div class="tx-acts">
          <button class="tx-btn" onclick="editEntry(${d.id})">Edit</button>
          <button class="tx-btn rm" onclick="deleteEntry(${d.id})">Remove</button>
        </div>
      </div>
    </div>`;
  });
  el.innerHTML=html;
}

function renderBreakdown(){
  const key=viewMonthKey();
  const expenses=dataForMonth(key).filter(d=>d.type==='expense');
  const brkEl=document.getElementById('breakdown');
  if(!expenses.length){
    brkEl.innerHTML='<div class="empty">No expenses this month.</div>';
    document.getElementById('pie-legend').innerHTML='';
    if(pieChart){pieChart.destroy();pieChart=null;}
    if(trendChart){trendChart.destroy();trendChart=null;}
    return;
  }
  const totals={};const totalSpent=expenses.reduce((s,d)=>s+d.amount,0);
  expenses.forEach(d=>{totals[d.cat]=(totals[d.cat]||0)+d.amount;});
  const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]);

  if(pieChart){pieChart.destroy();pieChart=null;}
  pieChart=new Chart(document.getElementById('pie-chart').getContext('2d'),{
    type:'doughnut',
    data:{
      labels:sorted.map(([c])=>c),
      datasets:[{data:sorted.map(([,v])=>v),backgroundColor:sorted.map(([c])=>catColor(c)),borderWidth:0,hoverOffset:8}]
    },
    options:{responsive:true,cutout:'65%',
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${fmt(c.raw)} (${Math.round(c.raw/totalSpent*100)}%)`}}},
      animation:{animateRotate:true,duration:600}
    }
  });
  document.getElementById('pie-legend').innerHTML=sorted.map(([cat])=>`
    <div class="pie-leg-item"><div class="pie-leg-dot" style="background:${catColor(cat)}"></div>${cat}</div>`).join('');

  const now=new Date();const months=[],inc6=[],spt6=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const md=dataForMonth(k);
    months.push(d.toLocaleDateString('en-AE',{month:'short'}));
    inc6.push(md.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0));
    spt6.push(md.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0));
  }
  const gc=isDark()?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.05)';
  const tc=isDark()?'#6e6a8a':'#8b85b0';
  if(trendChart){trendChart.destroy();trendChart=null;}
  trendChart=new Chart(document.getElementById('trend-chart').getContext('2d'),{
    type:'bar',
    data:{labels:months,datasets:[
      {label:'Income',data:inc6,backgroundColor:'rgba(52,211,153,.18)',borderColor:'#34d399',borderWidth:1.5,borderRadius:5},
      {label:'Spent',data:spt6,backgroundColor:'rgba(248,113,113,.18)',borderColor:'#f87171',borderWidth:1.5,borderRadius:5}
    ]},
    options:{responsive:true,
      plugins:{legend:{display:true,labels:{color:tc,font:{family:'Courier New',size:10},boxWidth:10,padding:14}},
        tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.raw)}`}}},
      scales:{
        x:{grid:{color:gc},ticks:{color:tc,font:{family:'Courier New',size:10}}},
        y:{grid:{color:gc},ticks:{color:tc,font:{family:'Courier New',size:10},callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v}}
      }
    }
  });

  const max=sorted[0][1];
  brkEl.innerHTML=sorted.map(([cat,amt])=>{
    const pct=Math.round(amt/totalSpent*100),barPct=Math.round(amt/max*100);
    const col=catColor(cat),emoji=catEmoji(cat);
    return`<div class="brkdn-row">
      <div class="brkdn-top">
        <div class="brkdn-cat"><div class="brkdn-dot" style="background:${col}"></div>${emoji} ${cat}</div>
        <div class="brkdn-amt">${fmt(amt)}</div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${barPct}%;background:${col}"></div></div>
      <div class="brkdn-pct">${pct}% of total spending</div>
    </div>`;
  }).join('');
}

/* BUDGET */
function setBudgetIncome(){
  const v=parseFloat(document.getElementById('b-inc-val').value);
  if(!v||v<=0)return;
  budget.income=v;saveBudget();renderBudget();
  document.getElementById('b-inc-val').value='';
  document.getElementById('bgt-income-form').style.display='none';
}
function editBudgetIncome(){
  document.getElementById('b-inc-val').value=budget.income||'';
  document.getElementById('bgt-income-form').style.display='block';
  document.getElementById('b-inc-val').focus();
}
function clearBudgetIncome(){
  if(!confirm('Remove expected income?'))return;
  budget.income=0;saveBudget();renderBudget();
}
function toggleAddBudget(){const f=document.getElementById('add-budget-form');f.style.display=f.style.display==='none'?'block':'none';}
function addBudgetItem(){
  const cat=document.getElementById('b-cat').value;
  const amt=parseFloat(document.getElementById('b-amt').value);
  if(!amt||amt<=0)return;
  const ex=budget.items.findIndex(i=>i.cat===cat);
  if(ex>=0)budget.items[ex].amount=amt;
  else budget.items.push({cat,amount:amt});
  saveBudget();renderBudget();
  document.getElementById('b-amt').value='';
  document.getElementById('add-budget-form').style.display='none';
}
function deleteBudgetItem(cat){budget.items=budget.items.filter(i=>i.cat!==cat);saveBudget();renderBudget();}

function renderBudget(){
  const key=viewMonthKey();
  const incDisplay=document.getElementById('budget-income-display');
  const form=document.getElementById('bgt-income-form');
  if(budget.income>0){
    form.style.display='none';
    incDisplay.innerHTML=`<div class="bgt-total-card"><div><div class="bt-lbl">Expected income</div><div class="bt-val">${fmt(budget.income)}</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><button class="bgt-income-btn" onclick="editBudgetIncome()">Edit</button><button class="bgt-income-btn danger" onclick="clearBudgetIncome()">Remove</button></div></div>`;
  } else {
    form.style.display='block';
    incDisplay.innerHTML='';
  }
  const actuals={};
  dataForMonth(key).filter(d=>d.type==='expense').forEach(d=>{actuals[d.cat]=(actuals[d.cat]||0)+d.amount;});
  const el=document.getElementById('budget-items');
  if(!budget.items.length){el.innerHTML='<div class="empty">No budget limits yet.<br>Tap + Add limit to set one.</div>';document.getElementById('budget-summary-card').innerHTML='';return;}
  const totBgt=budget.items.reduce((s,i)=>s+i.amount,0);
  const totAct=budget.items.reduce((s,i)=>s+(actuals[i.cat]||0),0);
  el.innerHTML=budget.items.map(item=>{
    const actual=actuals[item.cat]||0;
    const pct=Math.min(Math.round(actual/item.amount*100),100);
    const over=actual>item.amount?Math.round((actual-item.amount)/item.amount*100):0;
    const fc=pct<70?'ok':pct<100?'warn':'over';
    const rem=item.amount-actual;
    const status=rem>=0?`AED ${rem.toFixed(0)} left`:`AED ${Math.abs(rem).toFixed(0)} over`;
    const sc=rem>=0?'var(--green)':'var(--red)';
    return`<div class="bgt-card">
      <div class="bgt-card-top">
        <div class="bgt-card-l"><span style="font-size:16px">${catEmoji(item.cat)}</span>${item.cat}</div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="bgt-card-r">${fmt(actual)} / ${fmt(item.amount)}</div>
          <button class="bgt-del" onclick="deleteBudgetItem('${item.cat}')">× Remove</button>
        </div>
      </div>
      <div class="bgt-bar-track"><div class="bgt-bar ${fc}" style="width:${pct}%"></div></div>
      <div class="bgt-footer"><span style="color:${sc}">${status}</span><span>${pct}% used${over>0?' (+'+over+'% over)':''}</span></div>
    </div>`;
  }).join('');
  const proj=budget.income-totBgt;
  const pc=proj>=0?'var(--green)':'var(--red)';
  document.getElementById('budget-summary-card').innerHTML=`
    <div class="bgt-card" style="margin-top:8px;border-style:dashed">
      <div class="sec-label" style="margin:0 0 12px">Month summary</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px"><span style="color:var(--muted)">Total budgeted</span><span style="font-weight:700">${fmt(totBgt)}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px"><span style="color:var(--muted)">Actual spent</span><span style="font-weight:700;color:var(--red)">${fmt(totAct)}</span></div>
      ${budget.income>0?`<div style="display:flex;justify-content:space-between;font-size:13px;border-top:1px solid var(--border);padding-top:9px;margin-top:4px"><span style="color:var(--muted)">Projected balance</span><span style="font-weight:700;color:${pc}">${fmt(proj)}</span></div>`:''}
    </div>`;
}

/* CATEGORIES */
function toggleAddCatForm(){const f=document.getElementById('add-cat-form');f.style.display=f.style.display==='none'?'block':'none';}
function saveNewCategory(){
  const name=document.getElementById('new-cat-name').value.trim();
  const emoji=document.getElementById('new-cat-emoji').value.trim()||'🏷';
  const color=document.getElementById('new-cat-color').value||'#a78bfa';
  if(!name){alert('Please enter a name.');return;}
  if(categories.find(c=>c.name.toLowerCase()===name.toLowerCase())){alert('Category already exists.');return;}
  categories.push({name,emoji,color,builtin:false});
  saveCats();populateSelects();renderCatList();
  document.getElementById('new-cat-name').value='';
  document.getElementById('new-cat-emoji').value='';
  document.getElementById('add-cat-form').style.display='none';
}
function deleteCategory(name){
  const cat=categories.find(c=>c.name===name);
  if(!cat||cat.builtin)return;
  if(!confirm(`Delete "${name}"? Existing transactions will keep this category name.`))return;
  categories=categories.filter(c=>c.name!==name);
  saveCats();populateSelects();renderCatList();
}
function renderCatList(){
  const el=document.getElementById('cat-list');
  if(!el)return;
  el.innerHTML=categories.filter(c=>c.name!=='Income').map(c=>`
    <div class="cat-item">
      <div class="cat-emoji">${c.emoji}</div>
      <div class="cat-name">${c.name}</div>
      <div class="cat-swatch" style="background:${c.color}"></div>
      <button class="cat-del${c.builtin?' locked':''}" onclick="deleteCategory('${c.name}')" title="${c.builtin?'Built-in — cannot delete':'Delete'}">✕</button>
    </div>`).join('');
}

/* CALENDAR */
let calSelectedDate = null;

function renderCalendar(){
  const key = viewMonthKey();
  const vd  = viewMonthDate();
  const year = vd.getFullYear();
  const month = vd.getMonth(); // 0-based
  const todayStr = today();

  // All entries for this month
  const monthData = dataForMonth(key);

  // Build per-day lookup: { 'YYYY-MM-DD': {spent, income, entries[]} }
  const dayMap = {};
  monthData.forEach(d => {
    if(!dayMap[d.date]) dayMap[d.date] = {spent:0, income:0, entries:[]};
    if(d.type==='expense') dayMap[d.date].spent += d.amount;
    else dayMap[d.date].income += d.amount;
    dayMap[d.date].entries.push(d);
  });

  // Heat scale — max daily spend this month
  const maxSpend = Math.max(1, ...Object.values(dayMap).map(d=>d.spent));

  // Days of week headers
  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');

  // First day of month (0=Sun)
  const firstDow = new Date(year, month, 1).getDay();
  // Days in month
  const daysInMonth = new Date(year, month+1, 0).getDate();
  // Days in previous month
  const prevDays = new Date(year, month, 0).getDate();

  // Leading blanks from previous month
  for(let i = firstDow - 1; i >= 0; i--){
    const d = prevDays - i;
    html += `<div class="cal-day other-month"><div class="cal-day-num">${d}</div></div>`;
  }

  // Actual days
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const info = dayMap[dateStr] || {spent:0, income:0, entries:[]};
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === calSelectedDate;

    // Heat class
    let heatClass = '';
    if(info.spent > 0){
      const ratio = info.spent / maxSpend;
      heatClass = ratio < 0.25 ? 'heat-1' : ratio < 0.5 ? 'heat-2' : ratio < 0.75 ? 'heat-3' : 'heat-4';
    }

    // Category dots (up to 5)
    const dots = info.entries.slice(0,5).map(e=>{
      const col = catColor(e.cat);
      return `<div class="cal-pip-dot" style="background:${col}"></div>`;
    }).join('');

    const spentHtml  = info.spent  > 0 ? `<div class="cal-day-spent">-${fmtS(info.spent)}</div>` : '';
    const incomeHtml = info.income > 0 ? `<div class="cal-day-income">+${fmtS(info.income)}</div>` : '';

    html += `<div class="cal-day ${isToday?'today':''} ${isSelected?'selected':''} ${heatClass}"
      onclick="calSelectDay('${dateStr}')">
      <div class="cal-day-num">${d}</div>
      <div class="cal-pip">${dots}</div>
      ${spentHtml}${incomeHtml}
    </div>`;
  }

  // Trailing blanks
  const totalCells = firstDow + daysInMonth;
  const trailing = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for(let d = 1; d <= trailing; d++){
    html += `<div class="cal-day other-month"><div class="cal-day-num">${d}</div></div>`;
  }

  document.getElementById('cal-grid').innerHTML = html;

  // Re-render detail if a day is selected
  if(calSelectedDate && dayMap[calSelectedDate]){
    renderCalDetail(calSelectedDate, dayMap[calSelectedDate]);
  } else if(calSelectedDate){
    // selected date has no data — show empty
    renderCalDetail(calSelectedDate, {spent:0, income:0, entries:[]});
  } else {
    document.getElementById('cal-detail').style.display = 'none';
  }
}

function calSelectDay(dateStr){
  calSelectedDate = calSelectedDate === dateStr ? null : dateStr;
  renderCalendar();
}

function renderCalDetail(dateStr, info){
  const panel = document.getElementById('cal-detail');
  const label = dateStr === today() ? 'Today' :
    new Date(dateStr+'T00:00:00').toLocaleDateString('en-AE',{weekday:'long',day:'numeric',month:'long'});

  let txHtml = '';
  if(!info.entries.length){
    txHtml = `<div class="cal-detail-empty">No transactions on this day.</div>`;
  } else {
    txHtml = info.entries.map(d=>{
      const col=catColor(d.cat),emoji=catEmoji(d.cat);
      const sign=d.type==='income'?'+':'-', acls=d.type==='income'?'pos':'neg';
      return`<div class="tx-item" style="margin-bottom:6px">
        <div class="tx-dot" style="background:${col}22;color:${col}">${emoji}</div>
        <div class="tx-body"><div class="tx-desc">${d.desc}</div><div class="tx-meta">${d.cat}</div></div>
        <div class="tx-right">
          <div class="tx-amt ${acls}">${sign}${fmt(d.amount)}</div>
          <div class="tx-acts">
            <button class="tx-btn" onclick="editEntry(${d.id});calSelectedDate='${dateStr}'">Edit</button>
            <button class="tx-btn rm" onclick="deleteEntry(${d.id})">Remove</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  panel.style.display = 'block';
  panel.innerHTML = `
    <div class="cal-detail-hdr">
      <div class="cal-detail-date">${label}</div>
      <button class="cal-detail-close" onclick="calSelectDay('${dateStr}')">✕</button>
    </div>
    <div class="cal-detail-totals">
      <div class="cal-dt"><div class="cal-dt-lbl">Spent</div><div class="cal-dt-val" style="color:var(--red)">${info.spent>0?fmt(info.spent):'—'}</div></div>
      <div class="cal-dt"><div class="cal-dt-lbl">Income</div><div class="cal-dt-val" style="color:var(--green)">${info.income>0?fmt(info.income):'—'}</div></div>
      <div class="cal-dt"><div class="cal-dt-lbl">Net</div><div class="cal-dt-val" style="color:${(info.income-info.spent)>=0?'var(--green)':'var(--red)'}">${fmt(info.income-info.spent)}</div></div>
    </div>
    ${txHtml}`;
}

/* BACKUP & RESTORE */
function backupData(){
  const payload={
    version:1,
    exportedAt:new Date().toISOString(),
    data,
    budget,
    categories
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const dateStr=new Date().toISOString().slice(0,10);
  a.href=url;
  a.download=`tracker-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function restoreData(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const payload=JSON.parse(e.target.result);
      // Support both raw array export and wrapped object
      const incoming=payload.version?payload:{version:1,data:payload,budget:{income:0,items:[]},categories:[...DEFAULT_CATS]};
      if(!Array.isArray(incoming.data))throw new Error('Invalid backup file.');
      const count=incoming.data.length;
      if(!confirm(`This will replace all current data with ${count} transaction${count!==1?'s':''} from the backup.\n\nContinue?`)){
        event.target.value='';return;
      }
      data=incoming.data;
      budget=incoming.budget||{income:0,items:[]};
      categories=incoming.categories&&incoming.categories.length?incoming.categories:[...DEFAULT_CATS];
      save();saveBudget();saveCats();
      populateSelects();render();
      if(activeTab==='breakdown')renderBreakdown();
      if(activeTab==='budget')renderBudget();
      if(activeTab==='manage')renderCatList();
      if(activeTab==='calendar')renderCalendar();
      closeSidebar();
      alert(`✅ Restored ${count} transaction${count!==1?'s':''} successfully.`);
    }catch(err){
      alert('❌ Could not read backup file. Make sure it\'s a valid Tracker backup.');
    }
    event.target.value='';
  };
  reader.readAsText(file);
}

/* INIT */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSheet();closeEditSheet();closeSidebar();}
});
populateSelects();
render();
